# Lavalink v4 untuk NV Bot. Kata sandi dibaca dari variabel LAVALINK_PASSWORD (file .env).
server:
  port: 2333
  address: 0.0.0.0
lavalink:
  plugins:
    # Plugin sumber YouTube (diunduh otomatis saat container pertama kali jalan)
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      youtube: false # dimatikan: digantikan plugin di atas
      bandcamp: false
      soundcloud: true # dipakai jika MUSIC_SOURCE=soundcloud (tanpa login)
      twitch: false
      vimeo: false
      nico: false
      http: false # cegah pemutaran dari alamat sembarang
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    trackStuckThresholdMs: 10000
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Urutan = urutan dicoba. YouTube dari IP rumah sering meminta login ("Sign in to confirm
    # you're not a bot"); TV + OAuth adalah jalur yang paling stabil.
    clients:
      - TV
      - MUSIC
      - ANDROID_VR
      - TVHTML5_SIMPLY
      - WEB
    # Login Google lewat kode perangkat. Nilai diatur dari .env (YT_OAUTH, YT_REFRESH_TOKEN).
    # PAKAI AKUN GOOGLE CADANGAN, bukan akun utama: ada risiko akun diblokir YouTube.
    oauth:
      enabled: ${YT_OAUTH:false}
      refreshToken: "${YT_REFRESH_TOKEN:}"
      skipInitialization: ${YT_SKIP_INIT:false}
logging:
  level:
    root: INFO
    lavalink: INFO
