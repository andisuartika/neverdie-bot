# Lavalink v4 untuk NV Bot. Kata sandi dibaca dari variabel LAVALINK_PASSWORD (file .env).
server:
  port: 2333
  address: 0.0.0.0
lavalink:
  plugins:
    # Plugin sumber YouTube (diunduh otomatis saat container pertama kali jalan)
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      youtube: false # dimatikan: digantikan plugin di atas
      bandcamp: false
      soundcloud: false
      twitch: false
      vimeo: false
      nico: false
      http: false # cegah pemutaran dari alamat sembarang
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    trackStuckThresholdMs: 10000
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - TVHTML5_SIMPLY
logging:
  level:
    root: INFO
    lavalink: INFO
