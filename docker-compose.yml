services:
  bot:
    build:
      context: .
      args:
        YTDLP_REFRESH: ${YTDLP_REFRESH:-0}
    container_name: neverdie-bot
    restart: unless-stopped
    env_file: .env
    # DNS publik: alamat YouTube dari DNS router sebagian lambat/terblokir dari jaringan ini.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - bot-data:/data
    # Bergabung ke jaringan Docker milik 9router, panggil lewat nama container.
    networks:
      - default
      - router
    # Pengamanan dasar
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 512m
    cpus: 1.0

networks:
  router:
    external: true
    name: 9router_default

volumes:
  bot-data:
